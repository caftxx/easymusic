[package]
name = "easymusic"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Agent-friendly music search and download CLI with an MCP audio server"
license = "MIT"
repository = "https://github.com/caftxx/easymusic"
keywords = ["music", "audio", "streaming", "agent", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]

[lib]
name = "easymusic"
path = "src/lib.rs"

[[bin]]
name = "easymusic"
path = "src/main.rs"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls"] }
rmcp = { version = "2.2", features = ["server", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.49", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5"

# Terminating a plugin's process tree (see src/provider/external.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
strip = true
