[package]
name = "easy-music"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Agent-friendly music search, streaming, download, and MCP server"
license = "MIT"
repository = "https://github.com/caftxx/easy-music"
keywords = ["music", "audio", "streaming", "agent", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]

[lib]
name = "easy_music"
path = "src/lib.rs"

[[bin]]
name = "easy-music"
path = "src/main.rs"

[dependencies]
async-stream = "0.3"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "2.2", features = ["server", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.49", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync"] }
url = "2.5"

[profile.release]
lto = "thin"
strip = true
